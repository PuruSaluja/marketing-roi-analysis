# Publishes the Plotly dashboard to GitHub Pages from main. The page is built here
# from nothing: the default run is generated (seed 42), loaded into the service
# database and analysed, and the extracts take the committed optimiser run, which
# they refuse unless it is of that data. The versions are those in constraints.txt.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One at a time, in the order pushed: a run waiting behind another is replaced by a
# newer one, so the commit published last is the newest. A deployment under way is
# left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketing_roi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Throwaway credentials for the service container above.
      MARKETING_ROI_DSN: postgresql://postgres:postgres@localhost:5432/marketing_roi

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install
        run: python -m pip install -c constraints.txt -e .

      - name: Generate and load the default run
        run: |
          python -m marketing_roi.generate --out data/generated --seed 42
          python -m marketing_roi.load --data data/generated

      - name: Create the analysis views
        run: python -m marketing_roi.analysis

      - name: Write the extracts
        run: python -m marketing_roi.extracts --out extracts --optimise results/optimise-42.json

      - name: Draw the dashboard
        run: python -m marketing_roi.dashboard --extracts extracts --out site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    # A deployment fails on a repository with Pages turned off, as a fork's usually is;
    # there the run stops at a built page.
    if: github.event.repository.has_pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
